services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - '${POSTGRES_PORT}:5432'

    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:latest
    ports:
      - '${REDIS_PORT}:6379'

volumes:
  db_data:
